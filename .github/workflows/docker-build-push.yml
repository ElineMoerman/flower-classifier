name: Build and Push Docker Images

on:
  push:
    branches:
      - main  # or your default branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push flower-api image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile  # adjust if your Dockerfile path is different
        push: true
        tags: elinemoerman219/flower-api:latest

    - name: Build and push flower-frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile  # adjust path if needed
        push: true
        tags: elinemoerman219/flower-frontend:latest

