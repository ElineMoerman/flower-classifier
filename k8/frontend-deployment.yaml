apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flower-frontend
  template:
    metadata:
      labels:
        app: flower-frontend
    spec:
      containers:
        - name: flower-frontend
          image: elinemoerman219/flower-frontend:latest
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: flower-frontend
spec:
  type: LoadBalancer
  selector:
    app: flower-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
